name: Backend CI

on:
  push:
  pull_request:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: zandu-sales-manager-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: backend/var/composer-cache
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: >
          docker compose run --rm
          -e COMPOSER_CACHE_DIR=/app/var/composer-cache
          backend
          composer install
          --no-interaction
          --prefer-dist
          --no-progress

      - name: Generate JWT key pair
        run: make auth-keys

      - name: Start services
        run: docker compose up -d

      - name: Show service status
        run: docker compose ps

      - name: Apply controlled migrations
        run: make database-migrate

      - name: Validate code and configuration
        run: make lint

      - name: Run tests
        run: make test

      - name: Validate architecture
        run: make architecture

      - name: Validate immutable production image
        run: make staging-test

      - name: Verify PostgreSQL backup and restore
        run: make backup-restore-test

      - name: Stop services
        if: always()
        run: docker compose down -v
