name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Frontend workspace validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2.1.0
        with:
          working-directory: frontend
          runtime: node@24
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test workspace resolution
        run: pnpm test:workspace
