services:
  backend:
    build:
      context: ./backend
    working_dir: /app
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-zandu}
      POSTGRES_USER: ${POSTGRES_USER:-zandu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zandu}

      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-zandu}:${POSTGRES_PASSWORD:-zandu}@postgres:5432/${POSTGRES_DB:-zandu}?serverVersion=18&charset=utf8
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zandu}
      POSTGRES_USER: ${POSTGRES_USER:-zandu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zandu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-zandu} -d ${POSTGRES_DB:-zandu}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
