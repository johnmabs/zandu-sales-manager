services:
    _defaults:
        autowire: true
        autoconfigure: true

    Zandu\DataFixtures\AppFixtures: ~

    Zandu\Platform\Auth\Security\BootstrapUserProvider:
        arguments:
            $email: "%env(AUTH_BOOTSTRAP_EMAIL)%"
            $passwordHash: "%env(AUTH_BOOTSTRAP_PASSWORD_HASH)%"
            $actorId: "%env(AUTH_BOOTSTRAP_ACTOR_ID)%"
            $organizationId: "%env(AUTH_BOOTSTRAP_ORGANIZATION_ID)%"
            $userId: "%env(AUTH_BOOTSTRAP_USER_ID)%"

    Zandu\Modules\IdentityAccess\Infrastructure\Security\PersistentUserProvider:
        arguments:
            $bootstrap: '@Zandu\Platform\Auth\Security\BootstrapUserProvider'

    Zandu\Platform\Auth\Refresh\RefreshSessionStore:
        alias: Zandu\Platform\Auth\Refresh\InMemoryRefreshSessionStore
