    Zandu\Modules\CashManagement\Domain\CashMovement\CashMovementRepository:
        alias: Zandu\Modules\CashManagement\Infrastructure\Persistence\Orm\DoctrineCashMovementRepository
    Zandu\Modules\CashManagement\Application\Contract\CashMovementRecorder:
        alias: Zandu\Modules\CashManagement\Application\SalePaymentCashMovementRecorder
    Zandu\Modules\CashManagement\Application\Contract\CashRefundRecorder:
        alias: Zandu\Modules\CashManagement\Application\CashRefundMovementRecorder
    Zandu\Modules\Sales\Application\Contract\PaymentRecorder:
        alias: Zandu\Modules\Payments\Application\CashSalePaymentRecorder
    Zandu\Modules\Payments\Domain\PaymentRepository:
        alias: Zandu\Modules\Payments\Infrastructure\Persistence\DbalPaymentRepository
    Zandu\Modules\Sales\Domain\SaleRepository:
        alias: Zandu\Modules\Sales\Infrastructure\Persistence\DbalSaleRepository
    Zandu\Modules\Sales\Domain\SaleLineCostSnapshotRepository:
        alias: Zandu\Modules\Sales\Infrastructure\Persistence\DbalSaleLineCostSnapshotRepository
    Zandu\Modules\Sales\Application\Contract\RefundableReturnProvider:
