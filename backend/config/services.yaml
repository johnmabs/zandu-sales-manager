    Zandu\Modules\Inventory\Domain\StockMovement\StockMovementRepository:
        alias: Zandu\Modules\Inventory\Infrastructure\Persistence\Orm\DoctrineStockMovementRepository
    Zandu\Modules\Inventory\Application\Contract\StockAvailabilityProvider:
        alias: Zandu\Modules\Inventory\Application\RepositoryStockAvailabilityProvider
    Zandu\Modules\Inventory\Application\Contract\CostingStockPositionProvider:
        alias: Zandu\Modules\Inventory\Application\RepositoryCostingStockPositionProvider
    Zandu\Modules\Inventory\Application\Contract\InventoryStockConsumer:
        alias: Zandu\Modules\Inventory\Application\RepositoryInventoryStockConsumer
    Zandu\Modules\Inventory\Application\Contract\InventoryStockRestocker:
        alias: Zandu\Modules\Inventory\Application\RepositoryInventoryStockRestocker
    Zandu\Modules\InventoryCosting\Domain\Valuation\StockValuationRepository:
        alias: Zandu\Modules\InventoryCosting\Infrastructure\Persistence\Orm\DoctrineStockValuationRepository
    Zandu\Modules\InventoryCosting\Domain\ValuationMovement\StockValuationMovementRepository:
        alias: Zandu\Modules\InventoryCosting\Infrastructure\Persistence\Orm\DoctrineStockValuationMovementRepository
    Zandu\Modules\InventoryCosting\Application\Contract\InventoryMovementValuer:
        alias: Zandu\Modules\InventoryCosting\Application\RepositoryInventoryMovementValuer
    Zandu\Modules\CashManagement\Domain\CashRegister\CashRegisterRepository:
        alias: Zandu\Modules\CashManagement\Infrastructure\Persistence\Orm\DoctrineCashRegisterRepository
    Zandu\Modules\CashManagement\Domain\CashSession\CashSessionRepository:
