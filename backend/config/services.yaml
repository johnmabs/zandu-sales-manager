# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
# parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Zandu\:
        resource: "../src/"
        exclude:
            - "../src/DataFixtures/"
            - "../src/Platform/Api/Exception/*.php"
            - "../src/Platform/Auth/Security/BootstrapUserProvider.php"
            - "../src/Platform/Decimal/BrickDecimal.php"
            - "../src/Platform/Identity/SymfonyUuid.php"
            - "../src/SharedKernel/Context/*.php"
            - "../src/SharedKernel/Error/*.php"
            - "../src/SharedKernel/Identity/*Id.php"
            - "../src/SharedKernel/Idempotency/*.php"
            - "../src/SharedKernel/Messaging/*Id.php"
            - "../src/SharedKernel/Money/*.php"
            - "../src/SharedKernel/Quantity/*.php"

    Zandu\SharedKernel\Decimal\DecimalFactory:
        alias: Zandu\Platform\Decimal\BrickDecimalFactory

    Zandu\SharedKernel\Identity\UuidFactory:
        alias: Zandu\Platform\Identity\SymfonyUuidFactory

    Zandu\SharedKernel\Identity\IdGenerator:
        alias: Zandu\Platform\Identity\SymfonyUuidV7Generator

    Zandu\SharedKernel\Time\Clock:
        alias: Zandu\Platform\Time\SystemClock

    Zandu\SharedKernel\Context\CurrentActorProvider:
        alias: Zandu\Platform\Auth\Context\ActorContextResolver

    Zandu\SharedKernel\Tenancy\TenantTransaction:
        alias: Zandu\Platform\Persistence\DoctrineTenantTransaction

    Zandu\SharedKernel\SecurityAudit\SecurityAuditRepository:
        alias: Zandu\Platform\Persistence\DbalSecurityAuditRepository

    Zandu\SharedKernel\SecurityAudit\SecurityAuditTrail:
        alias: Zandu\Platform\SecurityAudit\TransactionalSecurityAuditTrail

    Zandu\SharedKernel\Messaging\OutboxRepository:
        alias: Zandu\Platform\Persistence\DbalOutboxRepository

    Zandu\Platform\Persistence\DoctrineTenantTransaction:
        arguments:
            $runtimeRole: "%env(TENANT_DATABASE_ROLE)%"

    Zandu\Platform\Auth\Security\ProductionSecurityConfigurationGuard:
        arguments:
            $environment: '%kernel.environment%'
            $appSecret: '%kernel.secret%'
            $jwtPassphrase: '%env(JWT_PASSPHRASE)%'

    Zandu\Platform\Auth\Security\PublicAuthRateLimitSubscriber:
        arguments:
            $authenticationLimiter: '@limiter.authentication'
            $onboardingLimiter: '@limiter.onboarding'
            $tokenSessionLimiter: '@limiter.token_session'

    Zandu\Platform\Api\OpenApi\AdministrationOpenApiFactory:
        decorates: 'api_platform.openapi.factory'
        arguments:
            $decorated: '@Zandu\Platform\Api\OpenApi\AdministrationOpenApiFactory.inner'

    Zandu\Modules\Organization\Domain\OrganizationRepository:
        alias: Zandu\Modules\Organization\Infrastructure\Persistence\Orm\DoctrineOrganizationRepository

    Zandu\Modules\Organization\Domain\Store\StoreRepository:
        alias: Zandu\Modules\Organization\Infrastructure\Persistence\Orm\DoctrineStoreRepository

    Zandu\Modules\Organization\Application\Contract\StoreClosureBlockerProvider:
        alias: Zandu\Modules\Inventory\Application\InventoryStoreClosureBlockerProvider

    Zandu\Modules\Organization\Application\Contract\MemberInvitationPolicy:
        alias: Zandu\Modules\Organization\Application\CreatorMemberInvitationPolicy

    Zandu\Modules\Organization\Application\Contract\InitialOrganizationOwnerProvisioner:
        alias: Zandu\Modules\IdentityAccess\Application\ProvisionInitialOrganizationOwner

    Zandu\Modules\Organization\Application\Contract\OrganizationOnboardingProvisioner:
        alias: Zandu\Modules\Organization\Application\OrganizationOnboardingService

    Zandu\Modules\Organization\Application\Contract\OperationalGuard:
        alias: Zandu\Modules\Organization\Application\TenantOperationalGuard
    Zandu\Modules\Organization\Application\Contract\StoreBusinessContextProvider:
        alias: Zandu\Modules\Organization\Application\RepositoryStoreBusinessContextProvider

    Zandu\Modules\Organization\Domain\StoreClosure\StoreClosureRepository:
        alias: Zandu\Modules\Organization\Infrastructure\Persistence\Orm\DoctrineStoreClosureRepository

    Zandu\Modules\Catalog\Domain\UnitOfMeasureRepository:
        alias: Zandu\Modules\Catalog\Infrastructure\Persistence\Orm\DoctrineUnitOfMeasureRepository

    Zandu\Modules\Catalog\Domain\Category\CategoryRepository:
        alias: Zandu\Modules\Catalog\Infrastructure\Persistence\Orm\DoctrineCategoryRepository

    Zandu\Modules\Catalog\Domain\Product\ProductRepository:
        alias: Zandu\Modules\Catalog\Infrastructure\Persistence\Orm\DoctrineProductRepository

    Zandu\Modules\Catalog\Application\Contract\BasePackagingPresence:
        alias: Zandu\Modules\Catalog\Infrastructure\Persistence\Orm\DoctrineProductPackagingRepository

    Zandu\Modules\Catalog\Domain\ProductPackaging\ProductPackagingRepository:
        alias: Zandu\Modules\Catalog\Infrastructure\Persistence\Orm\DoctrineProductPackagingRepository

    Zandu\Modules\Catalog\Domain\ProductBarcode\ProductBarcodeRepository:
        alias: Zandu\Modules\Catalog\Infrastructure\Persistence\Orm\DoctrineProductBarcodeRepository

    Zandu\Modules\Catalog\Application\BarcodeResolver:
        alias: Zandu\Modules\Catalog\Application\RepositoryBarcodeResolver

    Zandu\Modules\Catalog\Application\Contract\SaleablePackagingSnapshotProvider:
        alias: Zandu\Modules\Catalog\Application\RepositorySaleablePackagingSnapshotProvider
    Zandu\Modules\Catalog\Application\Contract\InventoryProductProvider:
        alias: Zandu\Modules\Catalog\Application\RepositoryInventoryProductProvider
    Zandu\Modules\Catalog\Application\Contract\SaleProductProvider:
        alias: Zandu\Modules\Catalog\Application\RepositorySaleProductProvider
    Zandu\Modules\Sales\Application\Contract\SaleTaxPolicy:
        alias: Zandu\Modules\Sales\Application\ConfiguredSaleTaxPolicy
    Zandu\Modules\Sales\Application\ConfiguredSaleTaxPolicy:
        arguments:
            $policy: '%env(string:SALE_TAX_POLICY)%'

    Zandu\Modules\Pricing\Domain\PriceList\PriceListRepository:
