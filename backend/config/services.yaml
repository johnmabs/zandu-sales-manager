# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
# parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Zandu\:
        resource: "../src/"
        exclude:
            - "../src/Platform/Api/Exception/*.php"
            - "../src/Platform/Decimal/BrickDecimal.php"
            - "../src/Platform/Identity/SymfonyUuid.php"
            - "../src/SharedKernel/Context/*.php"
            - "../src/SharedKernel/Error/*.php"
            - "../src/SharedKernel/Identity/*Id.php"
            - "../src/SharedKernel/Idempotency/*.php"
            - "../src/SharedKernel/Messaging/*Id.php"
            - "../src/SharedKernel/Money/*.php"
            - "../src/SharedKernel/Quantity/*.php"

    Zandu\SharedKernel\Decimal\DecimalFactory:
        alias: Zandu\Platform\Decimal\BrickDecimalFactory

    Zandu\SharedKernel\Identity\UuidFactory:
        alias: Zandu\Platform\Identity\SymfonyUuidFactory

    Zandu\SharedKernel\Identity\IdGenerator:
        alias: Zandu\Platform\Identity\SymfonyUuidV7Generator

    Zandu\SharedKernel\Time\Clock:
        alias: Zandu\Platform\Time\SystemClock

    Zandu\Platform\Auth\Security\BootstrapUserProvider:
        arguments:
            $email: "%env(AUTH_BOOTSTRAP_EMAIL)%"
            $passwordHash: "%env(AUTH_BOOTSTRAP_PASSWORD_HASH)%"
            $actorId: "%env(AUTH_BOOTSTRAP_ACTOR_ID)%"
            $organizationId: "%env(AUTH_BOOTSTRAP_ORGANIZATION_ID)%"
            $userId: "%env(AUTH_BOOTSTRAP_USER_ID)%"

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
