# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    rate_limiter:
        authentication:
            policy: fixed_window
            limit: 5
            interval: '1 minute'
        onboarding:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        token_session:
            policy: fixed_window
            limit: 30
            interval: '1 minute'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
