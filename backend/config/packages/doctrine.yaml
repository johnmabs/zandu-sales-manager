doctrine:
    dbal:
        url: "%env(resolve:DATABASE_URL)%"
        mapping_types:
            _uuid: string
        schema_filter: '~^(?:public\.)?doctrine_migration_versions$~'
        types:
            datetimetz_immutable: Zandu\Platform\Persistence\PostgreSqlDateTimeTzImmutableType

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: "%kernel.debug%"
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        schema_ignore_classes:
            - Zandu\Modules\CashManagement\Infrastructure\Persistence\Orm\CashMovementRecord
            - Zandu\Modules\CashManagement\Infrastructure\Persistence\Orm\CashRegisterRecord
            - Zandu\Modules\CashManagement\Infrastructure\Persistence\Orm\CashSessionRecord
            - Zandu\Modules\Catalog\Infrastructure\Persistence\Orm\CategoryRecord
            - Zandu\Modules\Catalog\Infrastructure\Persistence\Orm\ProductBarcodeRecord
            - Zandu\Modules\Catalog\Infrastructure\Persistence\Orm\ProductPackagingRecord
            - Zandu\Modules\Catalog\Infrastructure\Persistence\Orm\ProductRecord
            - Zandu\Modules\Catalog\Infrastructure\Persistence\Orm\UnitOfMeasureRecord
            - Zandu\Modules\IdentityAccess\Infrastructure\Persistence\Orm\OrganizationInvitationRecord
            - Zandu\Modules\IdentityAccess\Infrastructure\Persistence\Orm\OrganizationMembershipRecord
            - Zandu\Modules\IdentityAccess\Infrastructure\Persistence\Orm\UserRecord
            - Zandu\Modules\Inventory\Infrastructure\Persistence\Orm\StockMovementRecord
            - Zandu\Modules\Inventory\Infrastructure\Persistence\Orm\StockRecord
            - Zandu\Modules\InventoryCosting\Infrastructure\Persistence\Orm\StockValuationMovementRecord
            - Zandu\Modules\InventoryCosting\Infrastructure\Persistence\Orm\StockValuationRecord
            - Zandu\Modules\Organization\Infrastructure\Persistence\Orm\OrganizationRecord
            - Zandu\Modules\Organization\Infrastructure\Persistence\Orm\StoreClosureRecord
            - Zandu\Modules\Organization\Infrastructure\Persistence\Orm\StoreRecord
            - Zandu\Modules\Pricing\Infrastructure\Persistence\Orm\PriceListRecord
            - Zandu\Modules\Pricing\Infrastructure\Persistence\Orm\ProductPriceRecord
            - Zandu\Modules\Purchasing\Infrastructure\Persistence\Orm\SupplierRecord
        mappings:
            Organization:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/Modules/Organization/Infrastructure/Persistence/Orm"
                prefix: Zandu\Modules\Organization\Infrastructure\Persistence\Orm
                alias: Organization
            IdentityAccess:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/Modules/IdentityAccess/Infrastructure/Persistence/Orm"
                prefix: Zandu\Modules\IdentityAccess\Infrastructure\Persistence\Orm
                alias: IdentityAccess
            Catalog:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/Modules/Catalog/Infrastructure/Persistence/Orm"
                prefix: Zandu\Modules\Catalog\Infrastructure\Persistence\Orm
                alias: Catalog
            Pricing:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/Modules/Pricing/Infrastructure/Persistence/Orm"
                prefix: Zandu\Modules\Pricing\Infrastructure\Persistence\Orm
            Inventory:
                is_bundle: false
                type: attribute
                dir: "%kernel.project_dir%/src/Modules/Inventory/Infrastructure/Persistence/Orm"
                prefix: Zandu\Modules\Inventory\Infrastructure\Persistence\Orm
            InventoryCosting:
                is_bundle: false
                type: attribute
                dir: "%kernel.project_dir%/src/Modules/InventoryCosting/Infrastructure/Persistence/Orm"
                prefix: Zandu\Modules\InventoryCosting\Infrastructure\Persistence\Orm
            CashManagement:
                is_bundle: false
                type: attribute
                dir: "%kernel.project_dir%/src/Modules/CashManagement/Infrastructure/Persistence/Orm"
                prefix: Zandu\Modules\CashManagement\Infrastructure\Persistence\Orm
            Purchasing:
                is_bundle: false
                type: attribute
                dir: "%kernel.project_dir%/src/Modules/Purchasing/Infrastructure/Persistence/Orm"
                prefix: Zandu\Modules\Purchasing\Infrastructure\Persistence\Orm

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: "_test%env(default::TEST_TOKEN)%"

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
