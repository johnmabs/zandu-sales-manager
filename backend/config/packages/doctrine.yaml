doctrine:
    dbal:
        url: "%env(resolve:DATABASE_URL)%"

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: "%kernel.debug%"
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Organization:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/Modules/Organization/Infrastructure/Persistence/Orm"
                prefix: Zandu\Modules\Organization\Infrastructure\Persistence\Orm
                alias: Organization
            IdentityAccess:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/Modules/IdentityAccess/Infrastructure/Persistence/Orm"
                prefix: Zandu\Modules\IdentityAccess\Infrastructure\Persistence\Orm
                alias: IdentityAccess
            Catalog:
                type: attribute
                is_bundle: false
                dir: "%kernel.project_dir%/src/Modules/Catalog/Infrastructure/Persistence/Orm"
                prefix: Zandu\Modules\Catalog\Infrastructure\Persistence\Orm
                alias: Catalog

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: "_test%env(default::TEST_TOKEN)%"

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
